name: Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Set to "<codeberg-user>/<repo>" (or "<codeberg-user>/pages" for a root user/org site)
  SFS_REPO: ${{ github.repository }}

jobs:
  deploy:
    name: Build and Deploy to Codeberg Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: vmbbi/static-server-file-action/pages@main
        with:
          build-dir: '.'

      - name: Deploy to Codeberg Pages
        uses: vmbbi/static-server-file-action@main
        with:
          published: '.'
          path: '.'
          token: ${{ secrets.CODEBERG_TOKEN }}