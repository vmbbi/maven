name: Deploy

on:
  # Runs when upstream repos or manual commits update the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Target Codeberg repository: "<codeberg-user>/<repo>" (or "<codeberg-user>/pages" for a root user/org site)
  SFS_REPO: ${{ github.repository }}

jobs:
  deploy:
    name: Build and Deploy to Codeberg Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: vmbbi/static-file-server-actions/pages@main
        with:
          build-dir: '_site'

      - name: Push to Codeberg Pages
        shell: bash
        run: |
          cd _site
          git init -b pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: deploy pages"
          git remote add origin "https://${{ secrets.CODEBERG_TOKEN }}@codeberg.org/${{ env.SFS_REPO }}.git"
          git push --force origin pages